name: Build Windows

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PKHeX.slnx

      - name: Build Release
        run: dotnet build PKHeX.slnx --configuration Release --no-restore -m:1

      - name: Download latest EventsGallery database for tests
        run: |
          $tempPath = Join-Path $env:RUNNER_TEMP "pkhex-eventsgallery"
          $archivePath = Join-Path $env:RUNNER_TEMP "pkhex-eventsgallery.zip"
          Invoke-WebRequest -Uri "https://github.com/projectpokemon/EventsGallery/archive/refs/heads/master.zip" -OutFile $archivePath
          Expand-Archive -Path $archivePath -DestinationPath $tempPath -Force
          $mgdbPath = Join-Path $tempPath "EventsGallery-master/Released"
          if (!(Test-Path $mgdbPath)) {
            throw "The downloaded EventsGallery archive does not contain the Released database."
          }
          "PKHEX_TEST_MGDB_PATH=$mgdbPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        shell: pwsh

      - name: Run tests
        run: dotnet test Tests/PKHeX.Core.Tests/PKHeX.Core.Tests.csproj --configuration Release --no-build --no-restore

      - name: Verify Windows executable
        run: |
          if (!(Test-Path "PKHeX.WinForms/bin/Release/net10.0-windows/win-x64/PKCompassHeX.exe")) {
            throw "PKCompassHeX.exe was not produced."
          }
        shell: pwsh

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PKCompassHeX-windows-x64
          path: PKHeX.WinForms/bin/Release/net10.0-windows/win-x64/
          if-no-files-found: error
          retention-days: 30
